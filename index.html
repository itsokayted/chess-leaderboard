<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess.com Leaderboards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 44 44" aria-hidden="true">
        <rect width="44" height="44" rx="10" fill="#81b64c"/>
        <path fill="#14130f" d="M22 7a4 4 0 0 1 2.4 7.2c1.6 1 2.6 2.6 2.6 4.6 0 1.4-.5 2.6-1.3 3.6h-7.4a5.6 5.6 0 0 1-1.3-3.6c0-2 1-3.6 2.6-4.6A4 4 0 0 1 22 7Zm-5 17h10l1.6 7H15.4L17 24Zm-4 9h18v4H13v-4Z"/>
      </svg>
      <div>
        <h1>Chess.com Leaderboards</h1>
        <p class="sub">Live top-50 rankings for every mode, straight from Chess.com's public API.</p>
      </div>
    </div>
    <div class="updated"><span id="updated">Loading…</span><button class="btn" id="refresh">Refresh</button></div>
  </header>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <div class="toolbar">
    <label class="field" title="Filter this leaderboard">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="filter" type="search" placeholder="Filter by username or name">
    </label>
    <label class="field" style="flex:0 1 200px" title="Filter by country">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
      <select id="country"><option value="">All countries</option></select>
    </label>
    <form class="field" id="lookup" style="flex:1 1 260px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <input id="lookupInput" placeholder="Look up any player (e.g. hikaru)" autocomplete="off" spellcheck="false">
      <button class="btn primary" type="submit">Go</button>
    </form>
  </div>

  <div class="podium" id="podium"></div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="rank">#</th>
          <th>Player</th>
          <th class="hide-sm"></th>
          <th class="num sortable" data-sort="score">Rating</th>
          <th class="num sortable hide-sm" data-sort="games">W / L / D</th>
          <th class="num sortable hide-sm" data-sort="trend">Trend</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="state" class="state"><div class="spinner"></div>Loading leaderboards…</div>
  </div>

  <footer>
    Data from the <a href="https://www.chess.com/news/view/published-data-api" target="_blank" rel="noopener">Chess.com Published-Data API</a>.
    Chess.com publishes the top 50 players per category. Not affiliated with Chess.com.
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="btn close" id="closeDrawer" aria-label="Close">✕</button>
  <div id="drawerBody"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
