<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chess Leaderboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Chess Leaderboard</h1>
  <p id="status">Loading…</p>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Rating</th>
        <th>W / L / D</th>
      </tr>
    </thead>
    <tbody id="players"></tbody>
  </table>

  <script>
    fetch("https://api.chess.com/pub/leaderboards")
      .then(response => response.json())
      .then(data => {
        const tbody = document.getElementById("players");
        data.live_blitz.forEach(player => {
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>${player.rank}</td>
            <td><img src="${player.avatar}" alt="">${player.username}</td>
            <td class="rating">${player.score}</td>
            <td>${player.win_count} / ${player.loss_count} / ${player.draw_count}</td>
          `;
          tbody.appendChild(row);
        });
        document.getElementById("status").textContent = "Top 50 Blitz players";
      })
      .catch(() => {
        document.getElementById("status").textContent = "Couldn't load data.";
      });
  </script>
</body>
</html>
